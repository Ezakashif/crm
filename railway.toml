# Railway configuration for the primary App (HTTP) service.
# Docs: https://docs.railway.com/guides/laravel
# Let Railpack handle composer + npm install/build automatically.

[deploy]
preDeployCommand = "chmod +x ./railway/init-app.sh && ./railway/init-app.sh"
healthcheckPath = "/up"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

